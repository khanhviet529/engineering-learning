# Cổng CI của Flowboard — hiện thực bảng trong docs/operations/ci-cd.md.
#
# Mọi job dưới đây **chặn merge**. Đặc biệt là container image: theo phán quyết
# của controller trong ci-cd.md, image phải build được từ chính commit của pull
# request, chứ không phải chỉ kiểm ở lúc release. Đội chấp nhận CI chậm hơn để
# bắt lỗi Dockerfile và build context trước khi thay đổi được merge.
#
# Hàng Format cố ý chỉ phủ source và config: Markdown nằm ngoài phạm vi vì
# docs/superpowers/** là snapshot có ngày và ADR đã Accepted đều bị cấm sửa nội
# dung. Tính đúng đắn của tài liệu do link check bảo đảm.

name: Flowboard CI

# **Vị trí của file này là một phần của hợp đồng.** GitHub Actions chỉ đọc
# `.github/workflows/` ở **gốc repository**; một workflow nằm trong thư mục con
# không bao giờ được thực thi. Bản gốc của file này từng nằm ở
# `07-projects/fullstack-lab/.github/workflows/ci.yml` và vì vậy **chưa chạy
# lần nào** — năm cổng bên dưới tồn tại dưới dạng văn bản trong suốt sáu mốc.
# `container-image` lẽ ra đã chặn merge ở lỗi `web.Dockerfile` mà frontend phải
# tự tìm bằng tay ở M5.5.
#
# `paths` giới hạn nó vào đúng thư mục lab: phần còn lại của repository là kho
# kiến thức riêng, và một thay đổi ở đó không được kéo theo một lượt CI dựng
# Docker.

on:
  push:
    branches: [main]
    paths:
      - "07-projects/fullstack-lab/**"
      - ".github/workflows/fullstack-lab-ci.yml"
  pull_request:
    paths:
      - "07-projects/fullstack-lab/**"
      - ".github/workflows/fullstack-lab-ci.yml"

defaults:
  run:
    working-directory: 07-projects/fullstack-lab

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: 07-projects/fullstack-lab/.nvmrc

      - name: Bật corepack cho pnpm đã ghim trong package.json
        run: corepack enable

      - name: Cài dependency theo đúng lockfile
        run: pnpm install --frozen-lockfile

      - name: Token phải khớp artifact thiết kế
        # Sinh lại rồi so với bản đã commit. Lệch nghĩa là ai đó sửa tay
        # tokens.css, hoặc artifact đã đổi mà chưa chạy `pnpm tokens`.
        run: |
          pnpm tokens
          git diff --exit-code -- packages/ui/src/tokens.css

      - name: Build workspace package trước, vì mọi bước sau resolve qua `dist`
        # `packages/*` trỏ `main`/`types` vào `./dist`, nên `typecheck` của
        # `packages/mock` và `apps/web` cần chúng **đã build** — trong khi bước
        # `Build` ở cuối job lại chạy sau. Máy dev không bao giờ thấy vì `dist`
        # còn sót từ lần build trước; runner sạch thì đổ ngay ở resolve.
        #
        # Đây là lần **thứ ba** cùng một nguyên nhân, sau `web.Dockerfile` ở
        # M5.5 và job `integration` ở lượt CI trước. Quy tắc: một phụ thuộc
        # được thoả mãn bằng state còn sót lại thì chưa phải một phụ thuộc đã
        # được khai báo.
        run: pnpm --filter "./packages/**" build

      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit và contract test
        run: pnpm test

      - name: Build
        run: pnpm build

  integration:
    name: Integration test trên PostgreSQL thật
    runs-on: ubuntu-latest
    # Mock repository không chứng minh được tính nguyên tử, phạm vi query hay việc
    # constraint có thật sự chặn hay không. Những thứ đó chỉ đúng khi database nói
    # chúng đúng — xem docs/operations/testing-strategy.md.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: flowboard
          POSTGRES_USER: flowboard
          POSTGRES_PASSWORD: ci-local-only
        options: >-
          --health-cmd "pg_isready -U flowboard -d flowboard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 5432:5432
    env:
      DATABASE_URL_HOST: postgres://flowboard:ci-local-only@localhost:5432/flowboard
      # Job này **là** cổng integration, nên bỏ qua vì thiếu database không phải
      # một lựa chọn. Không có cờ này thì mất `DATABASE_URL_HOST` sẽ cho
      # `434 passed | 334 skipped` và job vẫn **xanh** — đo được trên lượt CI
      # thật ở job `quality`, nơi con số đó là đúng và vô hại.
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: 07-projects/fullstack-lab/.nvmrc

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Build workspace package mà API import
        # `apps/api` import `@flowboard/contracts`, và package đó trỏ `main` vào
        # `./dist`. Trên một runner sạch `dist` **không tồn tại**, nên test đổ
        # ngay ở lúc resolve: "Failed to resolve entry for package". Máy dev
        # không bao giờ thấy lỗi này vì `dist` còn lại từ những lần build trước
        # — cùng loại với lỗi `web.Dockerfile` mà M5.5 phải tìm bằng tay.
        run: pnpm --filter @flowboard/contracts build

      - name: Chạy migration tường minh, không dùng schema push
        run: pnpm --filter @flowboard/api exec drizzle-kit migrate
        env:
          DATABASE_URL: postgres://flowboard:ci-local-only@localhost:5432/flowboard

      - name: Integration test
        run: pnpm --filter @flowboard/api test

  e2e:
    name: E2E qua browser trên stack Compose
    runs-on: ubuntu-latest
    # `needs` là một quyết định về **thứ tự thông tin**, không phải về tốc độ.
    # E2E là cổng đắt nhất ở đây: nó dựng bốn container rồi lái một trình duyệt
    # thật. Chạy nó khi format, lint, typecheck hay integration còn đỏ chỉ tạo
    # thêm một màu đỏ thứ hai cho cùng một nguyên nhân, và người đọc phải đoán
    # cái nào là gốc.
    needs: [quality, integration]
    # Bộ này **không** nằm trong `pnpm verify`: `verify` phải chạy được trên một
    # máy không có Docker, và một cổng đòi hạ tầng sẽ bị tắt ở lần đầu nó cản
    # đường ai đó. Gốc `package.json` loại nó tường minh
    # (`--filter=!@flowboard/e2e`), còn `lint` và `typecheck` vẫn phủ nó.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: 07-projects/fullstack-lab/.nvmrc

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Build workspace package trước, vì bước migration resolve qua `dist`
        # `drizzle-kit migrate` nạp `apps/api/drizzle.config.ts`, và từ đó là
        # schema của `apps/api` — cây import ấy chạm `@flowboard/contracts`, một
        # package trỏ `main` vào `./dist`. Trên runner sạch `dist` không tồn
        # tại. Đây là **lần thứ tư** cùng một nguyên nhân trong dự án này
        # (`web.Dockerfile`, job `integration`, job `quality`), nên nó được viết
        # ra thay vì được hy vọng.
        run: pnpm --filter "./packages/**" build

      - name: Chuẩn bị `.env` cho Compose
        # `.env.example` là bản mẫu được version; giá trị thật không nằm trong
        # Git. Ở CI, secret là chuỗi dùng một lần cho một stack sống vài phút
        # rồi biến mất cùng runner.
        #
        # `RATE_LIMIT_OVERRIDES` nới **đúng hai route đã đặt tên**, và chỉ ở
        # đây. Không có giá trị nào nghĩa là "không giới hạn": bảng production
        # vẫn nguyên vẹn cho mọi route khác, và một tên route gõ sai làm API
        # chết lúc khởi động chứ không bị bỏ qua im lặng. Lý do cần nó: cả bộ
        # E2E đi ra từ **một** IP và cần khoảng mười tài khoản, trong khi hạn
        # mức thật là 5 lần mỗi phút — không nới thì hai phần ba thời gian chạy
        # là thời gian chờ, và chờ là nguồn chập chờn lớn nhất.
        run: |
          cp .env.example .env
          {
            # `CURSOR_SECRET`, **không** phải tên cũ `SESSION_SECRET`. Đường
            # tương thích ngược để tên mới thắng khi có cả hai, nên append tên
            # cũ ở đây sẽ khiến CI chạy bằng chuỗi **placeholder** đã commit
            # trong `.env.example` thay vì chuỗi ngẫu nhiên vừa sinh — và chỉ
            # nói ra bằng một dòng cảnh báo giữa hàng nghìn dòng log.
            echo "CURSOR_SECRET=ci-cursor-secret-$(openssl rand -hex 24)"
            echo "CSRF_SECRET=ci-csrf-secret-$(openssl rand -hex 24)"
            echo 'RATE_LIMIT_OVERRIDES={"auth.sign-up":{"limit":200,"windowMs":60000},"auth.sign-in":{"limit":200,"windowMs":60000}}'
          } >> .env

      - name: Dựng bốn service và chờ chúng khoẻ
        run: docker compose -f infra/compose/compose.yaml --env-file .env up -d --build --wait

      - name: Chạy migration tường minh, không dùng schema push
        # Cùng một command với job `integration` và với máy dev: schema của môi
        # trường E2E không được đi một đường khác với schema của production.
        run: pnpm --filter @flowboard/api exec drizzle-kit migrate
        env:
          DATABASE_URL: postgres://flowboard:doi-gia-tri-nay@localhost:5433/flowboard

      - name: Cài Chromium cho Playwright
        run: pnpm --filter @flowboard/e2e exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm --filter @flowboard/e2e test
        env:
          # Nới phía client đúng bằng lượng đã nới phía server. Nới một phía
          # thôi thì phía kia vẫn giữ nhịp cũ và không nhanh hơn chút nào.
          E2E_SIGN_UP_BUDGET: "200"

      - name: Log của container khi E2E đỏ
        # Một bài E2E đỏ mà không biết server nói gì thì phải chạy lại để biết —
        # và "chạy lại để biết" là bước đầu của "chạy lại cho tới khi xanh".
        if: failure()
        run: docker compose -f infra/compose/compose.yaml --env-file .env logs --no-color --tail 200

      - name: Giữ lại report và trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            07-projects/fullstack-lab/e2e/playwright-report
            07-projects/fullstack-lab/e2e/test-results
          retention-days: 7

  docs:
    name: Liên kết tài liệu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Không được có link chết giữa các tài liệu
        run: python scripts/check-doc-links.py

  container-image:
    name: Container image (cổng chặn merge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image của API
        run: docker build -f infra/docker/api.Dockerfile -t flowboard-api:${{ github.sha }} .

      - name: Build image của web
        run: docker build -f infra/docker/web.Dockerfile -t flowboard-web:${{ github.sha }} .

      - name: Ghi lại digest của image
        run: |
          docker image inspect flowboard-api:${{ github.sha }} --format '{{.Id}}'
          docker image inspect flowboard-web:${{ github.sha }} --format '{{.Id}}'

  topology:
    name: Topology local đúng bốn service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compose phải parse được và có đúng bốn service
        # Không Redis, không BullMQ, không worker, không broker. Phase 1.2 mới
        # thêm chúng, và khi đó phải kèm ADR.
        run: |
          cp .env.example .env.ci
          services=$(docker compose --env-file .env.ci -f infra/compose/compose.yaml config --services | sort | tr '\n' ' ')
          echo "services: $services"
          test "$services" = "api mailpit postgres web "
