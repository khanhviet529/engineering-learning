# Topology local và integration CI của Flowboard.
#
# ĐÚNG BỐN SERVICE, theo docs/operations/local-development.md. Không Redis,
# không BullMQ, không apps/worker, không queue dashboard, không broker. Phase 1.2
# mới thêm Redis và worker, và thay đổi đó cần ADR cùng với việc cập nhật
# topology, health, backup, telemetry và test trong cùng một lượt.

name: flowboard

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Named volume: dữ liệu sống qua các lần stop/start. Xoá dữ liệu chỉ xảy
      # ra qua lệnh reset tường minh nhắm đúng volume này.
      - flowboard-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      # Cổng host cấu hình được và **không** mặc định là 5432. Máy developer thường đã
      # có một PostgreSQL khác giữ cổng đó, và khi hai bên cùng nghe thì công cụ chạy
      # từ host sẽ nối nhầm database mà không báo gì rõ ràng hơn "sai mật khẩu".
      # Trong mạng Compose, `api` vẫn nối tới `postgres:5432` như bình thường.
      - "${POSTGRES_HOST_PORT}:5432"

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "${MAILPIT_SMTP_HOST_PORT}:1025" # SMTP
      - "${MAILPIT_UI_HOST_PORT}:8025" # giao diện xem mail
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV}
      API_PORT: ${API_PORT}
      WEB_ORIGIN: ${WEB_ORIGIN}
      DATABASE_URL: ${DATABASE_URL}
      # Ký cursor phân trang, không ký session — xem `shared/config/env.ts`.
      #
      # Nhận cả tên cũ `SESSION_SECRET` trong khoảng chuyển tiếp: một môi
      # trường chưa kịp đổi biến vẫn khởi động được và nhận một cảnh báo, thay
      # vì chết vì thiếu biến bắt buộc. Mặc định rỗng ở cả hai để Compose không
      # cảnh báo biến chưa đặt; `env.ts` mới là chỗ bắt buộc phải có một cái.
      CURSOR_SECRET: ${CURSOR_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      CURSOR_SECRET_PREVIOUS: ${CURSOR_SECRET_PREVIOUS:-}
      CSRF_SECRET: ${CSRF_SECRET}
      CSRF_SECRET_PREVIOUS: ${CSRF_SECRET_PREVIOUS:-}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      # Credential SMTP: rỗng ở local (Mailpit). Đặt cả hai hoặc không cái nào.
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Flowboard <no-reply@flowboard.test>}
      LOG_LEVEL: ${LOG_LEVEL}
      # Nới rate limit cho **môi trường này**, không cho production.
      #
      # E2E tạo dữ liệu qua chính sản phẩm — cố ý, vì một seed ghi thẳng vào
      # database sẽ bỏ qua đúng phần cần kiểm — và đi ra từ một IP. Không có
      # biến này, mỗi lượt E2E phải tự giữ nhịp và mất thêm khoảng hai phút.
      #
      # Mặc định rỗng: thiếu cấu hình thì API nhận **bảng giới hạn production**,
      # không phải không giới hạn. Xem `shared/config/env.ts`.
      RATE_LIMIT_OVERRIDES: ${RATE_LIMIT_OVERRIDES:-}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    ports:
      - "${API_HOST_PORT}:${API_PORT}"
    healthcheck:
      # Liveness, không phải readiness: readiness phụ thuộc database, và dùng nó
      # ở đây sẽ khiến Compose restart API trong khi lỗi nằm ở PostgreSQL.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+process.env.API_PORT+'/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    # **Không** truyền `NODE_ENV` xuống đây. Container này chạy `next start`, tức
    # là server production trên artefact do `next build` sinh ra; đặt
    # `NODE_ENV=development` lên nó là khai một chế độ mà nó không chạy, và
    # Next.js cảnh báo đúng như vậy ở log khởi động.
    #
    # Biến đó tồn tại trong `.env` vì **api** cần nó: `development` là thứ tắt cờ
    # `Secure` của cookie phiên, mà không tắt thì trình duyệt không gửi cookie
    # qua `http://localhost` và mọi request thành `401`. Một biến, hai nghĩa
    # trái ngược — nên nó chỉ được gắn vào đúng service cần nó.
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_HOST_PORT}:3000"

volumes:
  flowboard-postgres-data:
